<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>e2e_calib reports</title>
<style>
  :root {
    --ink: #0f0f0e;
    --ink-dim: #6b6a63;
    --bg: #f6f4ed;
    --panel: #ffffff;
    --accent: #c13c14;
    --border: #e0ddd2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--ink);
    background: var(--bg);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }
  nav {
    width: 280px;
    flex: 0 0 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 24px 0;
  }
  nav h1 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--ink-dim);
    padding: 0 24px 16px;
    font-weight: 600;
  }
  nav ul { list-style: none; }
  nav li a {
    display: block;
    padding: 10px 24px;
    font-size: 0.95rem;
    color: var(--ink);
    text-decoration: none;
    border-left: 3px solid transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  nav li a:hover {
    background: #faf8f1;
  }
  nav li a.active {
    background: #fceee8;
    border-left-color: var(--accent);
    color: var(--accent);
    font-weight: 600;
  }
  nav .sec {
    font-size: 0.75rem;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    padding: 20px 24px 8px;
    font-weight: 600;
  }
  main {
    flex: 1 1 auto;
    position: relative;
    background: #fff;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .empty {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--ink-dim);
    font-size: 1.1rem;
  }
</style>
</head>
<body>
<nav>
  <h1>e2e_calib reports</h1>
  <div class="sec">Main</div>
  <ul>
    <li><a data-src="index.html">index.html</a></li>
    <li><a data-src="report.html">report.html</a></li>
  </ul>
  <div class="sec">Experiments</div>
  <ul>
    <li><a data-src="cross_frame_report.html">Cross-frame residual net</a></li>
    <li><a data-src="cross_frame_curves.html">Cross-frame curves</a></li>
    <li><a data-src="deform_report.html">Deformable attention</a></li>
    <li><a data-src="ba_report.html">Bundle adjustment</a></li>
  </ul>
  <div class="sec">Other</div>
  <ul>
    <li><a data-src="order_of_attention.md" data-raw="1">order_of_attention.md (raw)</a></li>
    <li><a data-src="images/" data-raw="1">images/</a></li>
    <li><a data-src="assets/" data-raw="1">assets/</a></li>
  </ul>
</nav>
<main>
  <iframe id="view" src="cross_frame_report.html"></iframe>
</main>
<script>
  const links = document.querySelectorAll('nav a');
  const iframe = document.getElementById('view');
  function activate(el) {
    links.forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    iframe.src = el.dataset.src;
    try { history.replaceState(null, '', '#' + encodeURIComponent(el.dataset.src)); } catch (e) {}
  }
  links.forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    activate(a);
  }));
  // open from URL hash
  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) {
    const m = Array.from(links).find(a => a.dataset.src === hash);
    if (m) activate(m); else iframe.src = hash;
  } else {
    // default highlight
    const def = Array.from(links).find(a => a.dataset.src === 'cross_frame_report.html');
    if (def) def.classList.add('active');
  }
</script>
</body>
</html>

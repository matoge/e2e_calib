<!DOCTYPE html>
<html lang="en">
<head>
<link rel="stylesheet" href="assets/report.css">
<meta charset="UTF-8">
<title>e2e_calib reports</title>
</head>
<body class="r-hub">
<nav class="r-sidebar">
  <div class="lang-toggle">
    <button id="btn-en" class="lang-btn active" type="button">EN</button>
    <button id="btn-ja" class="lang-btn" type="button">JA</button>
  </div>

  <h1>e2e_calib reports</h1>

  <div class="sec">Overview</div>
  <ul>
    <li><a data-src="technical_overview.html">Technical overview</a></li>
    <li><a data-src="report.html">Bilingual writeup</a></li>
    <li><a data-src="session_progress.html">Session progress</a></li>
  </ul>

  <div class="sec">Experiments</div>
  <ul>
    <li><a data-src="cross_frame_report.html">Cross-frame residual net</a></li>
    <li><a data-src="cross_frame_blog.html">Cross-frame blog</a></li>
    <li><a data-src="cross_frame_curves.html">Cross-frame curves</a></li>
    <li><a data-src="deform_report.html">Deformable attention</a></li>
    <li><a data-src="ba_report.html">Bundle adjustment</a></li>
  </ul>

  <div class="sec">Raw</div>
  <ul>
    <li><a data-src="order_of_attention.md">order_of_attention.md</a></li>
    <li><a data-src="images/">images/</a></li>
    <li><a data-src="assets/">assets/</a></li>
  </ul>
</nav>
<main class="r-view">
  <iframe id="view" src="cross_frame_report.html"></iframe>
</main>
<script>
  // HAS_JA: docs that also have a <stem>_ja.html variant on disk.
  // ONLY_JA: docs with no EN version yet (default to JA, keep EN disabled).
  const HAS_JA = new Set([
    'session_progress.html',
  ]);
  const ONLY_JA = new Set([
    'session_progress.html',
  ]);

  const links = document.querySelectorAll('nav a');
  const iframe = document.getElementById('view');
  const btnEN = document.getElementById('btn-en');
  const btnJA = document.getElementById('btn-ja');

  let currentLang = 'en';
  let currentStem = 'cross_frame_report.html';

  function toJA(stem) {
    if (stem.endsWith('.html')) return stem.replace(/\.html$/, '_ja.html');
    return stem;
  }
  function langUrl(stem, lang) {
    if (lang === 'ja' && HAS_JA.has(stem)) return toJA(stem);
    return stem;
  }
  function setLangButtons(stem) {
    const jaAvail = HAS_JA.has(stem);
    const enAvail = !ONLY_JA.has(stem);
    btnJA.disabled = !jaAvail;
    btnEN.disabled = !enAvail;
    if (!jaAvail && currentLang === 'ja') currentLang = 'en';
    if (!enAvail && currentLang === 'en') currentLang = 'ja';
    btnEN.classList.toggle('active', currentLang === 'en' && enAvail);
    btnJA.classList.toggle('active', currentLang === 'ja' && jaAvail);
  }

  function activate(el) {
    links.forEach(a => a.classList.remove('active'));
    el.classList.add('active');
    currentStem = el.dataset.src;
    setLangButtons(currentStem);
    iframe.src = langUrl(currentStem, currentLang);
    try { history.replaceState(null, '', '#' + encodeURIComponent(currentStem)); } catch (e) {}
  }

  links.forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    activate(a);
  }));

  btnEN.addEventListener('click', () => {
    if (btnEN.disabled) return;
    currentLang = 'en';
    setLangButtons(currentStem);
    iframe.src = langUrl(currentStem, currentLang);
  });
  btnJA.addEventListener('click', () => {
    if (btnJA.disabled) return;
    currentLang = 'ja';
    setLangButtons(currentStem);
    iframe.src = langUrl(currentStem, currentLang);
  });

  const hash = decodeURIComponent(location.hash.slice(1));
  if (hash) {
    let stem = hash;
    let lang = 'en';
    const m = hash.match(/^(.+)_ja\.html$/);
    if (m) { stem = m[1] + '.html'; lang = 'ja'; }
    const link = Array.from(links).find(a => a.dataset.src === stem);
    if (link) {
      currentLang = lang;
      activate(link);
    } else {
      iframe.src = hash;
    }
  } else {
    const def = Array.from(links).find(a => a.dataset.src === 'cross_frame_report.html');
    if (def) {
      def.classList.add('active');
      setLangButtons(currentStem);
    }
  }
</script>
</body>
</html>

location = /calibrate {
    proxy_pass http://calib-api:5002/calibrate;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location = /calibrate/frame {
    proxy_pass http://calib-api:5002/calibrate/frame;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
}
location /calibrate/ {
    proxy_pass http://calib-api:5002/calibrate/;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
}
location /static/ {
    proxy_pass http://calib-api:5002/static/;
    proxy_set_header Host $host;
}
location = /api/default {
    proxy_pass http://calib-api:5002/api/default;
    proxy_set_header Host $host;
}
location = /api/frames {
    proxy_pass http://calib-api:5002/api/frames;
    proxy_set_header Host $host;
}
location ~ ^/api/frame/[0-9]+$ {
    proxy_pass http://calib-api:5002$request_uri;
    proxy_set_header Host $host;
}
location = /api/calibrate {
    proxy_pass http://calib-api:5002/api/calibrate;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location = /api/scenes {
    proxy_pass http://calib-api:5002/api/scenes;
    proxy_set_header Host $host;
}
location = /api/calibrate_scene {
    proxy_pass http://calib-api:5002/api/calibrate_scene;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    client_max_body_size 50m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location = /api/calibrate_frame {
    proxy_pass http://calib-api:5002/api/calibrate_frame;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    client_max_body_size 200m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
location = /api/history {
    proxy_pass http://calib-api:5002/api/history;
    proxy_set_header Host $host;
}
